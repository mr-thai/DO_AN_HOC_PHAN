<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Apptech - Log in</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap-icons/1.8.1/font/bootstrap-icons.min.css"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="assets/css/login.css" />
    <script src="assets/js/include.js" defer></script>
    <script src="assets/js/notifications.js"></script>
  </head>
  <body>
    <div data-include="components/header.html"></div>
    <div class="form-login">
      <div class="login-container">
        <div class="login-header">
          <i class="bi bi-person-circle"></i> Log in
        </div>
        <div class="login-body">
          <h3 class="mb-4">Welcome Back</h3>
          <form id="loginForm">
            <div class="form-group">
              <input
                type="email"
                class="form-control mb-4"
                id="email"
                placeholder=" "
              />
              <label for="email" class="floating-label">Email</label>
            </div>

            <div class="form-group password-container">
              <input
                type="password"
                class="form-control"
                id="password"
                placeholder=" "
              />
              <label for="password" class="floating-label">Password</label>
              <i
                class="bi bi-eye-slash"
                id="togglePassword"
                onclick="togglePassword()"
              ></i>
            </div>

            <div class="text-end">
              <a href="#">Forgot password?</a>
            </div>

            <div class="form-check text-start mb-3">
              <input class="form-check-input" type="checkbox" id="remember" />
              <label class="form-check-label" for="remember">
                Remember me
              </label>
            </div>

            <button type="submit" class="btn-login">Log in</button>

            <div class="divider">OR</div>

            <button type="button" class="btn-signup">
              <a href="signup.html" class="text-decoration-none">Sign up</a>
            </button>
          </form>
        </div>
      </div>
    </div>
    <!-- *thong báo -->
    <!-- Toast Đăng Nhập -->
    <div
      class="toast-container position-fixed bottom-0 end-0 p-3"
      id="loginToastContainer"
    >
      <!-- Toast: Đăng nhập thành công -->
      <div
        class="toast"
        id="loginSuccessToast"
        role="alert"
        aria-live="assertive"
        aria-atomic="true"
      >
        <div class="toast-header bg-success">
          <strong class="me-auto text-white">Đăng nhập thành công</strong>
          <button
            type="button"
            class="btn-close"
            data-bs-dismiss="toast"
            aria-label="Close"
          ></button>
        </div>
        <div class="toast-body bg-success-subtle text-dark">
          Chào mừng bạn đã quay lại! Hãy khám phá website ngay thôi.
        </div>
      </div>

      <!-- Toast: Đăng nhập thất bại -->
      <div
        class="toast"
        id="loginErrorToast"
        role="alert"
        aria-live="assertive"
        aria-atomic="true"
      >
        <div class="toast-header bg-danger">
          <strong class="me-auto text-white">Đăng nhập thất bại</strong>
          <button
            type="button"
            class="btn-close"
            data-bs-dismiss="toast"
            aria-label="Close"
          ></button>
        </div>
        <div class="toast-body bg-danger-subtle text-dark">
          Tên tài khoản hoặc mật khẩu không đúng. Vui lòng thử lại.
        </div>
      </div>
    </div>

    <div data-include="components/footer.html"></div>
    <script src="assets/js/login.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
